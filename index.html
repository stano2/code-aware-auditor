function renderExamQuiz(block){
  const ex = state.exam[block.storageKey] || {answers:{}, submitted:false};
  const qs = block.questions;
  let html = `<div class="interactive"><div class="interactive-head"><span class="tag">${esc(block.tag)}</span><span class="title">${esc(block.title)}</span></div><div class="interactive-body">`;

  if(!ex.submitted){
    qs.forEach((q,qi)=>{
      const picked = ex.answers[qi];
      html += `<div class="qz"><p class="qmeta">Question ${qi+1} of ${qs.length}</p><p class="q">${esc(q.q)}</p>`;
      q.options.forEach((opt,oi)=>{
        const sel = picked===oi;
        html += `<button class="choice ${sel?"picked-neutral":""}" data-exam-pick="${block.storageKey}|${qi}|${oi}"><span class="lbl">${String.fromCharCode(65+oi)}</span>${esc(opt)}</button>`;
      });
      html += `</div>`;
    });
    const allAnswered = qs.every((q,qi)=>ex.answers[qi]!=null);
    html += `<button class="primary-btn" data-exam-submit="${block.storageKey}" ${allAnswered?"":"disabled"}>${allAnswered?"Submit assessment":`Answer all ${qs.length} questions to submit`}</button>`;
  } else {
    let correctCount = 0;
    qs.forEach((q,qi)=>{ if(ex.answers[qi]===q.correct) correctCount++; });
    const pct = Math.round(correctCount/qs.length*100);
    let bandClass, bandLabel, note;
    if(pct < 60){ bandClass="readiness-low"; bandLabel="Low Understanding"; note="Revisit the modules tied to the questions you missed before relying on this material operationally."; }
    else if(pct < 85){ bandClass="readiness-mid"; bandLabel="Intermediate"; note="Solid grasp of the fundamentals — review the missed items below to close specific gaps."; }
    else { bandClass="readiness-high"; bandLabel="Advanced Readiness"; note="Strong command of the program end-to-end."; }
    const r = 52, circ = 2*Math.PI*r;
    const dash = circ*(pct/100);

    html += `<div class="score-panel">
      <div class="score-ring"><svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--paper-2)" stroke-width="10"/>
        <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="${dash} ${circ}"/>
      </svg><div class="num"><span class="n">${pct}%</span><span class="d">${correctCount}/${qs.length}</span></div></div>
      <div class="band ${bandClass}">${bandLabel}</div>
      <p class="score-note">${note}</p>
      ${block.passBand ? `<p class="score-note" style="margin-top:10px;"><strong>${pct>=80?"Passing":"Not yet passing"}</strong> — certification threshold is 80%.</p>` : ""}
    </div>`;

    qs.forEach((q,qi)=>{
      const picked = ex.answers[qi];
      const ok = picked===q.correct;
      html += `<div class="qz"><p class="qmeta">Question ${qi+1} of ${qs.length}</p><p class="q">${esc(q.q)}</p>`;
      q.options.forEach((opt,oi)=>{
        let cls = "choice";
        if(oi===q.correct) cls += " correct"; else if(oi===picked) cls += " wrong";
        html += `<button class="${cls}" disabled><span class="lbl">${String.fromCharCode(65+oi)}</span>${esc(opt)}</button>`;
      });
      html += `<div class="outcome ${ok?"tier-low":"tier-high"}"><div class="head"><span class="pill ${ok?"low":"high"}">${ok?"Correct":"Missed"}</span></div></div></div>`;
    });
    html += `<button class="retry-btn" data-exam-retry="${block.storageKey}">Retake assessment</button>`;
  }
  html += `</div></div>`;
  return html;
}

    btn.addEventListener("click", ()=>{
      const [key, qi, oi] = btn.getAttribute("data-exam-pick").split("|");
      if(!state.exam[key]) state.exam[key] = {answers:{}, submitted:false};
      state.exam[key].answers[qi] = Number(oi);
      persist();
      renderMain();
    });
  });
  document.querySelectorAll("[data-exam-submit]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.exam[btn.getAttribute("data-exam-submit")].submitted = true;
      persist();
      renderMain();
    });
  });
  document.querySelectorAll("[data-exam-retry]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.exam[btn.getAttribute("data-exam-retry")] = {answers:{}, submitted:false};
      persist();
      renderMain();
    });
  });
}

/* ============================= CORE MODULE TEMPLATE ============================= */

function renderModule(m){
  let html = "";
  html += `<div class="objective"><span class="k">Learning Objectives</span><ul>${m.objectives.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div>`;

  html += `<div class="section-label">Real-World Audit Scenario</div>`;
  html += `<div class="case"><span class="case-tab">${esc(m.scenario.tab)}</span><p>${esc(m.scenario.body)}</p></div>`;

  html += `<div class="section-label">Core Concepts</div>`;
  html += `<div class="prose">${m.concepts}</div>`;

  html += `<div class="section-label">How to Read &amp; Interpret</div>`;
  html += renderCodebox(m.interpret.fileName, m.interpret.lang, m.interpret.code);
  html += renderLegend(m.interpret.legend);

  html += `<div class="section-label">Auditor Validation Lens</div>`;
  html += renderLens(m.lens);

  html += `<div class="section-label">Sample Artifacts</div>`;
  html += renderArtifactToggle("m"+m.id, m.artifacts);

  html += `<div class="section-label">Hands-On Exercise</div>`;
  html += renderExerciseBlock("ex-"+m.id, m.exercise);

  html += renderScenario(m.scenarioKey, "m"+m.id+"-"+m.scenarioKey);

  html += `<div class="section-label">Red Flags &amp; False Assurance Risks</div>`;
  html += renderRedFlags(m.redFlags);

  html += `<div class="section-label">Audit Documentation Guidance</div>`;
  html += `<div class="docguide-box"><p class="lbl">Guidance</p><p>${esc(m.docGuidance.note)}</p><div class="sample">${esc(m.docGuidance.sample)}</div></div>`;

  html += `<div class="section-label">Deliverables Checklist</div>`;
  html += `<div class="interactive"><div class="interactive-body">${renderChecklistGeneric("m"+m.id, m.deliverables)}</div></div>`;

  return html;
}
function bindModule(){
  bindArtifactToggle();
  bindExercise();
  bindScenario();
  bindChecklistGeneric();
}

/* ============================= CAPSTONE / REFERENCE TEMPLATES ============================= */

function renderCapstonePage(){
  let html = `<div class="case"><span class="case-tab">Capstone brief</span><p>${esc(CAPSTONE.brief)}</p></div>`;

  html += `<div class="section-label">Case File — checkout-service</div>`;
  CAPSTONE.caseFiles.forEach(cf=>{ html += renderCodebox(cf.fileName, cf.lang, cf.code); });

  html += `<div class="section-label">Sampling Exercise</div>`;
  html += renderExerciseBlock("capstone-sampling", CAPSTONE.samplingExercise);

  html += `<div class="section-label">Draft Your Audit Opinion</div>`;
  html += renderScenario("capstone_opinion", "capstone-opinion");

  html += `<div class="section-label">Deliverables Completeness Check</div>`;
  html += `<div class="interactive"><div class="interactive-body">${renderChecklistGeneric("capstone", CAPSTONE.deliverables)}</div></div>`;

  html += `<div class="section-label">Certification Assessment</div>`;
  html += renderExamQuiz(CAPSTONE.exam);

  return html;
}
function bindCapstonePage(){ bindExercise(); bindScenario(); bindChecklistGeneric(); bindExamQuiz(); }

function renderReferencePage(item){
  let html = `<p class="prose" style="margin-bottom:22px;">${esc(item.blurb)}</p>`;
  html += `<div class="interactive"><div class="interactive-head"><span class="tag">Reference</span><span class="title">${esc(item.title)}</span></div><div class="interactive-body">${item.render()}</div></div>`;
  return html;
}

/* ============================= MAIN RENDER ============================= */

function itemGroup(item){
  if(MODULES.some(m=>String(m.id)===String(item.id))) return "core";
  if(String(item.id)==="capstone") return "capstone";
  return "reference";
}

function markDoneIfEligible(id, group){
  if(group==="core"){ state.done.add(String(id)); persist(); }
}

function renderMain(){
  const id = state.currentId;
  const item = findItem(id);
  if(!item) return;
  const group = itemGroup(item);
  markDoneIfEligible(id, group);

  const groupLabels = { core:"Core Modules", capstone:"Capstone", reference:"Reference Library" };
  document.getElementById("topline-left").textContent = groupLabels[group].toUpperCase();
  document.getElementById("topline-right").textContent =
    group==="core" ? `MODULE ${item.num} / ${MODULES.length}` : groupLabels[group].toUpperCase();

  let html = "";
  if(group==="core") html += `<p class="eyebrow">Module ${item.num}</p>`;
  html += `<h1 class="module-title">${esc(item.title)}</h1>`;

  if(group==="core"){ html += renderModule(item); }
  else if(group==="capstone"){ html += renderCapstonePage(); }
  else if(group==="reference"){ html += renderReferencePage(item); }

  const idx = NAV_ORDER.findIndex(x=>String(x.id)===String(id));
  const prev = NAV_ORDER[idx-1], next = NAV_ORDER[idx+1];
  html += `<div class="footer-nav">
    ${prev ? `<button class="navbtn2" data-goto2="${prev.id}"><span class="arrow">←</span><span class="t">${esc(prev.title)}</span></button>` : `<span></span>`}
    ${next ? `<button class="navbtn2" data-goto2="${next.id}"><span class="t">${esc(next.title)}</span><span class="arrow">→</span></button>` : `<span></span>`}
  </div>`;

  document.getElementById("content").innerHTML = html;
  document.querySelectorAll("[data-goto2]").forEach(b=>b.addEventListener("click", ()=>goTo(b.getAttribute("data-goto2"))));

  if(group==="core") bindModule();
  else if(group==="capstone") bindCapstonePage();

  renderSide();
}

renderSide();
renderMain();

})();
</script>
